name: daily-log

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make commits
        run: |
          git config user.name "N2SOLANA"
          git config user.email "javapocketedition@gmail.com"

          if [ $((RANDOM % 4)) -eq 0 ]; then
            echo "Skipping today"
            exit 0
          fi

          n=$((RANDOM % 3 + 1))
          for j in $(seq 1 $n); do
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> log.txt
            git add log.txt
            git commit -m "Update log"
          done
          git push
